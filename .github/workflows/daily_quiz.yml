name: Grade 5 Daily Morning Quiz Dispatcher

on:
  schedule:
    # 20:00 UTC = 06:00 AM AEST (Australian Eastern Standard Time)
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  run-daily-quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Quiz Pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_PROJECT: "grade5-au-quiz-agent"
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python agent_runner.py

      - name: Archive generated PDFs (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-quiz-pdfs-${{ github.run_id }}
          path: |
            Grade_5_Morning_Challenge.pdf
            Grade_5_Answer_Key_and_Explanations.pdf
          retention-days: 7
